MACRO_TO_PKG:
- ['^(AC_PROG_LIBTOOL|LT_INIT|AC_LIBTOOL.*|LT_.*)$', 'libtool']
- ['^PKG_.*$', 'pkgconf-pkg-config']
- ['^AX_.*$', 'autoconf-archive']
- ['^(AM_GNU_GETTEXT.*|AM_ICONV|AM_NLS)$', 'gettext-devel']
- ['^AM_PATH_PYTHON$', 'automake']

