base_image: registry.access.redhat.com/ubi8/ubi:latest
image_name: rhel8-auto-probe
repo_name: LANLGeoMag
max_loops: 5
probe_commands:
- make --version
- g++ --version
- autoreconf --version
build_cmd: cd /app/repo && autoreconf -i && ./configure && make
packages:
- make
- gcc
- gcc-c++
- autoconf
- automake
- libtool
- diffutils
- file
- tar
- gzip
- patch
- git
- which
- pkgconf-pkg-config
source_builds:
- name: gsl-2.8
  script: set -eux; cd /tmp; curl -fL --retry 3 https://ftp.gnu.org/gnu/gsl/gsl-2.8.tar.gz -o gsl.tgz; tar xzf gsl.tgz; cd gsl-2.8; ./configure --prefix=/usr/local; make -j"$(nproc)"; make install; echo /usr/local/lib > /etc/ld.so.conf.d/usr-local.conf; ldconfig; cd /; rm -rf /tmp/gsl*
- name: hdf5-1.14.4-3
  script: set -eux; (dnf install -y zlib-devel || true); cd /tmp; curl -fL --retry 3 https://github.com/HDFGroup/hdf5/releases/download/hdf5_1.14.4.3/hdf5-1.14.4-3.tar.gz -o hdf5.tgz; tar xzf hdf5.tgz; cd hdf5-1.14.4-3; ./configure --prefix=/usr/local --enable-build-mode=production --enable-hl; make -j"$(nproc)"; make install; echo /usr/local/lib > /etc/ld.so.conf.d/usr-local.conf; ldconfig; test -f /usr/local/include/hdf5.h; cd /; rm -rf /tmp/hdf5*
python: true
python_version: '3.11'
pip_packages:
- python-dateutil
- matplotlib
- numpy
- scipy
- spacepy
python_path:
- /app/repo/Python
- /app/repo/Python/ctypesgen
install_cmd: cd /app/repo && make install && ldconfig
venv:
  reuse: false   # default; always rm -rf /opt/venv and recreate (original behavior)
  # reuse: true  # opt-in; skip recreation if /opt/venv already matches python_version

# --- Phase 2A.2: C/C++ submodule build stages (opt-in) ---------------------
# Empty/absent preserves the original behavior. Each stage builds once per run,
# before build_cmd, with cwd=/app/repo/<path> and $AP_PREFIX exported.
# Required keys: name, path, script. Optional: prefix (default /usr/local),
# env, required (default true), and lib_dirs/include_dirs/bin_dirs/pkgconfig_dirs
# overrides. A failing required stage aborts the build (and is diagnosable);
# required: false warns and continues.
submodule_builds: []
# Example (replace the empty list above and add cmake to `packages`):
# submodule_builds:
#   - name: bundled-lib
#     path: third_party/bundled-lib
#     prefix: /opt/autoprobe/bundled-lib
#     script: |
#       set -eux
#       cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$AP_PREFIX"
#       cmake --build build -j"$(nproc)"
#       cmake --install build
#     env:
#       CC: gcc
#     required: true

# --- Phase 2A.3: additional executable builds (opt-in) ---------------------
# Empty/absent preserves original behavior. Each entry builds a separate
# executable after the 2A.2 submodule stages (`after: submodules`, default)
# or after the main build+install (`after: build`). The 2A.2 exports
# (PATH/LD_LIBRARY_PATH/PKG_CONFIG_PATH/CPPFLAGS/LDFLAGS/CMAKE_PREFIX_PATH)
# are active for these scripts.
executable_builds: []
# Example (replace the empty list above):
# executable_builds:
#   - name: lanlgeomag-tool
#     path: tools/lanlgeomag-tool
#     after: submodules          # or: build
#     script: |
#       set -eux
#       gcc -o lanlgeomag-tool main.c $CPPFLAGS $LDFLAGS -lLanlGeoMag
#     install_script: |
#       install -m 0755 lanlgeomag-tool /usr/local/bin/
#     env:
#       CC: gcc
#     required: true

# --- Phase 2B.1: non-root runtime user (opt-in) ---------------------------
# Absent/null preserves the original behavior (the generated image runs as
# root). This affects ONLY the generated Containerfile: the probe container
# still builds as root so package installs and build stages keep working.
# `permissions:` is optional; when omitted, /app and /opt/autoprobe (plus
# /opt/venv when Python is enabled) are recursively owned by the runtime user.
runtime_user: null
# Example:
# runtime_user:
#   name: appuser
#   group: appuser        # default: same as name
#   uid: 1000
#   gid: 1000             # default: same as uid
#   home: /home/appuser
#   shell: /bin/bash
#   create: true          # false = user already exists in base image
# permissions:
#   chown:
#     - /app
#     - /opt/autoprobe
#     - /opt/venv
#   chmod:
#     - path: /app/repo
#       mode: "0775"

# --- Phase 2B.2: final-image runtime hardening (opt-in) -------------------
# Controls the generated image only; absent/empty preserves behavior.
#   workdir:   final WORKDIR (default /app)
#   env:       extra ENV values for the final image (HOME/USER are reserved)
#   read_only: prepare writable locations for `podman run --read-only`
runtime: {}
# Example:
# runtime:
#   workdir: /app/repo
#   env:
#     LOG_LEVEL: info
#   read_only: true
# With read_only: true, autoprobe exports TMPDIR, XDG_CACHE_HOME,
# XDG_CONFIG_HOME, MPLCONFIGDIR and PYTHONDONTWRITEBYTECODE, creates/chowns
# /tmp/.cache, /tmp/.config and /tmp/matplotlib, and `--verify` runs the image
# with `--read-only --tmpfs /tmp`.

# --- Phase 2B.3: final-image smoke tests for --verify (opt-in) ------------
# Empty/absent preserves the original verification behavior. Each test runs in
# its own `podman run --rm IMAGE` with the final image's WORKDIR, USER, ENV and
# read-only settings. A required failure makes `--verify` exit non-zero; an
# optional (required: false) failure is reported as WARN and does not fail.
smoke_tests: []
# Example (replace the empty list above):
# smoke_tests:
#   - name: imports
#     script: python -c "import numpy, scipy, spacepy"
#   - name: version
#     script: python -c "import LanlGeoMag; print(LanlGeoMag.__version__)"
#   - name: optional-plot
#     script: python -c "import matplotlib.pyplot as plt; plt.figure()"
#     required: false
# A bare string is shorthand for {name: smoke-N, script: <string>, required: true}.
